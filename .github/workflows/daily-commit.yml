name: ForeverGit

on:
  schedule:
    # 12:00 UTC = 07:00 CDT / 06:00 CST
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daily ping
        env:
          GIT_AUTHOR_NAME: ${{ github.repository_owner }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "${GIT_AUTHOR_EMAIL:-}" ]; then
            echo "Add repo secret GIT_EMAIL (an address from github.com/settings/emails)"
            exit 1
          fi
          python mmm___forever___pls.py once --push
